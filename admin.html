<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel • Studio 01</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root{--card:#111;--line:#262626;--mut:#9a9a9a;--wa:#25d366;--red:#e53935;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#eee;font-family:Inter,system-ui,sans-serif;line-height:1.45;padding-bottom:60px}
.wrap{max-width:720px;margin:auto;padding:0 14px}
.hide{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
input,select{width:100%;padding:12px;background:#000;border:1.5px solid var(--line);border-radius:10px;color:#fff;font-size:1rem;font-family:inherit;outline:none}
input:focus,select:focus{border-color:#fff}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 5px}
.btn{padding:11px 16px;border-radius:10px;border:1px solid #444;background:#1a1a1a;color:#fff;font-weight:600;cursor:pointer;font-family:inherit;font-size:.88rem}
.btn.w{background:#fff;color:#000;border-color:#fff}.btn.g{background:var(--wa);color:#000;border-color:var(--wa)}.btn.r{background:#2a1010;border-color:#5a2020;color:#ff8a80}
.btn.full{width:100%;margin-top:14px;padding:14px}
.btn:disabled{opacity:.4}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:18px}
#login .card{width:100%;max-width:380px;text-align:center}
#login img{height:90px;mix-blend-mode:lighten}
#login h2{margin:6px 0 4px}#login p{color:var(--mut);font-size:.85rem}
.lnk{background:none;border:none;color:var(--mut);text-decoration:underline;font-size:.8rem;cursor:pointer;margin-top:14px;font-family:inherit}
.err{color:#ff8a80;font-size:.85rem;margin-top:10px;min-height:1em}
/* app */
.top{position:sticky;top:0;z-index:10;background:#000;border-bottom:1px solid var(--line);padding:10px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between}
.top img{height:38px;mix-blend-mode:lighten}
.dn{display:flex;gap:6px;margin:16px 0 10px}
.dn input{text-align:center;font-weight:600}.dn .btn{padding:0 16px;font-size:1.2rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#000;color:#ddd;cursor:pointer;font-size:.82rem;font-family:inherit}
.chip.on{background:#fff;color:#000;border-color:#fff;font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stats div{flex:1;text-align:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.stats b{display:block;font-size:1.3rem}.stats span{font-size:.72rem;color:var(--mut)}
.it{border-left:4px solid #fff;margin-bottom:10px;font-size:.88rem}
.it.bl{border-left-color:var(--red);background:#150c0c}
.it .h{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.it .h b{font-size:1.05rem}.it .h span{color:var(--mut);font-size:.8rem}
.it p{color:#ccc}.it .bt{display:flex;gap:8px;margin-top:10px}.it .bt .btn{flex:1;padding:9px}
.empty{text-align:center;color:var(--mut);padding:36px 0}
/* modal */
#md{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#md .card{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0}
#md h3{margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv{display:grid;grid-template-columns:1fr;gap:6px;max-height:190px;overflow:auto}
.ck{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.88rem;margin:0;color:#eee}
.ck input{width:auto}.ck span{margin-left:auto;color:var(--mut)}
.warn{background:#2b2108;border:1px solid #6b5313;color:#ffd666;padding:10px;border-radius:8px;font-size:.82rem;margin:10px 0}
.tabs{display:flex;gap:6px;margin:14px 0 4px}
.tab{flex:1;padding:11px 6px;border-radius:10px;border:1.5px solid var(--line);background:#000;color:#ccc;font-weight:600;cursor:pointer;font-family:inherit;font-size:.85rem}
.tab.on{background:#fff;color:#000;border-color:#fff}
.cm{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}.cm b{font-size:1.1rem;text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cg small{text-align:center;color:var(--mut);font-size:.7rem;padding:4px 0}
.cd{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:#0c0c0c;color:#eee;cursor:pointer;font-family:inherit;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.9rem}
.cd i{font-style:normal;background:var(--wa);color:#000;border-radius:999px;font-size:.68rem;font-weight:700;padding:0 6px}
.cd.off{opacity:.3}.cd.today{border-color:#fff}.cd.blk{background:#1a0d0d}.cd.emp{visibility:hidden}
.cf{margin-top:12px}.cf h3{margin-bottom:6px}
.dias{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.srow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.srow label{margin:8px 0 3px}.srow .ck{margin:8px 8px 0 0;display:inline-flex}
.srow .ck input{width:auto}
.ok{color:#8ef0b0;font-size:.85rem;margin-top:10px}
.tab{font-size:.78rem;white-space:nowrap;flex:1 0 auto;padding:11px 10px}
.tabs{overflow-x:auto}
.gi{font-size:.85rem;color:#ccc;margin:8px 0}
.gw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#0a0a0a;max-height:72vh}
.gr{display:grid;position:relative}
.gh{position:sticky;top:0;z-index:3;background:#141414;border-bottom:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.gt{position:sticky;left:0;z-index:2;background:#0a0a0a;color:#666;font-size:.68rem;padding:3px 6px;border-top:1px solid #1a1a1a}
.gt.hr{color:#aaa;border-top-color:#333}
.gc{border:0;border-top:1px solid #1a1a1a;border-left:1px solid #1a1a1a;background:transparent;cursor:pointer}
.gc.hr{border-top-color:#333}.gc:hover{background:#181818}
.gb{margin:2px;border-radius:8px;padding:5px 7px;font-size:.74rem;line-height:1.25;overflow:hidden;cursor:pointer;z-index:1;border-left:3px solid rgba(255,255,255,.75);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gb b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gb small{display:block;opacity:.8}
.gb.bl{background:repeating-linear-gradient(45deg,#2a1010,#2a1010 8px,#1d0b0b 8px,#1d0b0b 16px);border-left-color:var(--red);color:#ffb4ab}
.gad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gad>div{position:relative;background:#111;border-radius:10px;overflow:hidden}
.gad img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gad button{position:absolute;border:none;border-radius:8px;font-family:inherit;cursor:pointer;font-size:.72rem;padding:5px 8px;background:rgba(0,0,0,.75);color:#fff}
.gad .x{top:4px;right:4px;background:rgba(160,30,30,.9)}.gad .ed{top:4px;left:4px}.gad .tg{left:4px;bottom:4px}
.gad small{display:block;padding:4px 6px;color:var(--mut);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:600px){#md{align-items:center}#md .card{border-radius:18px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login"><div class="card">
 <img src="logo.png" alt="Studio 01">
 <h2>Painel do Barbeiro</h2><p>Acesso restrito</p>
 <label style="text-align:left">E-mail</label><input id="em" type="email" autocomplete="username" placeholder="seu@email.com">
 <label style="text-align:left">Senha</label><input id="pw" type="password" autocomplete="current-password" placeholder="Sua senha">
 <button class="btn w full" id="bIn">Entrar</button>
 <div class="err" id="lerr"></div>
 <button class="lnk" id="bForgot">Esqueci minha senha</button>
</div></div>

<!-- APP -->
<div id="app" class="hide">
 <div class="top"><div class="wrap"><img src="logo.png" alt=""><div><a class="btn" href="index.html" target="_blank">Ver site</a> <button class="btn" id="bOut">Sair</button></div></div></div>
 <div class="wrap">
  <div class="tabs"><button class="tab on" data-t="ag">📋 Lista</button><button class="tab" data-t="gr">🗓️ Grade</button><button class="tab" data-t="cal">📅 Mês</button><button class="tab" data-t="cli">👥 Clientes</button><button class="tab" data-t="gal">🖼️ Fotos</button><button class="tab" data-t="cfg">⚙️ Ajustes</button></div>
  <div id="vAg">
  <div class="dn"><button class="btn" id="pv">‹</button><input type="date" id="dt"><button class="btn" id="nx">›</button><button class="btn" id="hj">Hoje</button></div>
  <div class="chips" id="chips"></div>
  <div class="acts"><button class="btn w" id="bNew">＋ Novo agendamento</button><button class="btn r" id="bBlock">🔒 Bloquear horário</button></div>
  <div class="stats"><div><b id="stN">0</b><span>Agendamentos</span></div><div><b id="stV">R$ 0</b><span>Previsto no dia</span></div></div>
  <div id="list"></div>
  </div>
  <div id="vGr" class="hide"></div><div id="vCal" class="hide"></div><div id="vCli" class="hide"></div><div id="vGal" class="hide"></div><div id="vCfg" class="hide"></div>
 </div>
</div>
<div id="md" class="hide"><div class="card" id="mdc"></div></div>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>"R$ "+Number(v).toFixed(2).replace(".",",");
const hhmm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fdata=s=>s.split("-").reverse().join("/");
const timeOpts=(sel,max=CLOSE)=>{let o="";for(let t=OPEN;t<=max;t+=STEP)o+=`<option value="${t}"${t==sel?" selected":""}>${hhmm(t)}</option>`;return o};

if(FIREBASE.apiKey.startsWith("SUA_")){
 document.body.innerHTML='<div style="padding:30px;max-width:520px;margin:auto"><h2>Falta configurar o Firebase</h2><p style="color:#aaa;margin-top:10px">Abra o arquivo <b>config.js</b> e cole as chaves do seu projeto Firebase no bloco FIREBASE. O passo a passo está no LEIA-ME.</p></div>';
 throw new Error("Firebase não configurado");
}
firebase.initializeApp(FIREBASE);
const auth=firebase.auth(),db=firebase.firestore();
let date=iso(new Date()),fb="all",AG=[],OC=[],off=null;

/* ---------- login ---------- */
$("em").value=localStorage.getItem("s01_email")||"";
const msgErr=c=>({"auth/invalid-credential":"E-mail ou senha incorretos.","auth/wrong-password":"E-mail ou senha incorretos.","auth/user-not-found":"E-mail ou senha incorretos.","auth/invalid-email":"E-mail inválido.","auth/too-many-requests":"Muitas tentativas. Aguarde alguns minutos ou redefina a senha.","auth/network-request-failed":"Sem conexão com a internet."}[c]||"Não foi possível entrar ("+c+").");
async function entrar(){
 $("lerr").textContent="";$("bIn").disabled=true;
 try{await auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value);localStorage.setItem("s01_email",$("em").value.trim())}
 catch(e){$("lerr").textContent=msgErr(e.code)}
 $("bIn").disabled=false;
}
$("bIn").onclick=entrar;$("pw").onkeydown=e=>{if(e.key=="Enter")entrar()};
$("bForgot").onclick=async()=>{const e=$("em").value.trim();if(!e){$("lerr").textContent="Digite seu e-mail acima primeiro.";return}
 try{await auth.sendPasswordResetEmail(e);$("lerr").style.color="#8ef0b0";$("lerr").textContent="Enviamos um link para redefinir a senha no seu e-mail."}catch(x){$("lerr").style.color="";$("lerr").textContent=msgErr(x.code)}};
$("bOut").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
 $("login").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);
 if(u){await carregaConfig(db);$("dt").value=date;montaChips();listen();clientesLive()}else{off&&off();off=null;cOff&&cOff();cOff=null}
});

/* ---------- agenda ---------- */
function montaChips(){
 $("chips").innerHTML=[["all","Todos"],...BARBEIROS.map(b=>[b.n,b.n])].map(([v,t])=>`<button class="chip${fb==v?" on":""}" data-v="${esc(v)}">${esc(t)}</button>`).join("");
}
$("chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;fb=c.dataset.v;montaChips();render()};
function setDate(d){date=d;$("dt").value=d;listen()}
$("dt").onchange=e=>e.target.value&&setDate(e.target.value);
const shift=n=>{const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+n);setDate(iso(d))};
$("pv").onclick=()=>shift(-1);$("nx").onclick=()=>shift(1);$("hj").onclick=()=>setDate(iso(new Date()));

function listen(){
 off&&off();AG=[];OC=[];render();
 const e=err=>{console.error(err);$("list").innerHTML='<div class="empty">Sem permissão ou erro ao carregar. Confira as regras do Firestore e se o e-mail do painel está nelas.</div>'};
 const u1=db.collection("agendamentos").where("data","==",date).onSnapshot(s=>{AG=s.docs.map(d=>({id:d.id,...d.data()}));render()},e);
 const u2=db.collection("ocupados").where("data","==",date).onSnapshot(s=>{OC=s.docs.map(d=>({id:d.id,...d.data()}));render()},e);
 off=()=>{u1();u2()};
}
const dosel=x=>fb=="all"||x.barbeiro==fb||x.barbeiro=="*";
function render(){
 gridRender();
 const ag=AG.filter(dosel).map(x=>({...x,k:"ag"}));
 const bl=OC.filter(x=>x.bloqueio&&dosel(x)).map(x=>({...x,k:"bl"}));
 const all=[...ag,...bl].sort((a,b)=>a.inicio-b.inicio);
 $("stN").textContent=ag.length;$("stV").textContent=brl(ag.reduce((a,x)=>a+(+x.total||0),0));
 if(!all.length){$("list").innerHTML=`<div class="empty">Nenhum agendamento em ${fdata(date)}.</div>`;return}
 $("list").innerHTML=all.map(x=>x.k=="bl"?
  `<div class="card it bl"><div class="h"><b>🔒 ${hhmm(x.inicio)} – ${hhmm(x.fim)}</b><span>${x.barbeiro=="*"?"Todos os barbeiros":esc(x.barbeiro)}</span></div><p>${esc(x.motivo||"Horário bloqueado")}</p><div class="bt"><button class="btn" data-a="free" data-id="${x.id}">Liberar horário</button></div></div>`:
  `<div class="card it"><div class="h"><b>⏰ ${hhmm(x.inicio)} – ${hhmm(x.fim)}</b><span>${esc(x.barbeiro)}</span></div>
   <p>👤 <b>${esc(x.cliente)}</b>${x.manual?" <span style='color:var(--mut)'>(manual)</span>":""}</p><p>✂️ ${esc((x.servicos||[]).join(" + "))}</p>${(x.silencio||x.obs)?`<p style="color:#ffd666">${x.silencio?"🤫 Em silêncio ":""}${x.obs?"📝 "+esc(x.obs):""}</p>`:""}<p>💰 ${totalTxt(+x.total||0,x.combinar)} • ${x.duracao||x.fim-x.inicio} min${x.telefone?" • 📞 "+esc(x.telefone):""}</p>
   <div class="bt">${x.telefone?`<button class="btn g" data-a="wa" data-id="${x.id}">WhatsApp</button>`:""}<button class="btn" data-a="mv" data-id="${x.id}">Remarcar</button><button class="btn r" data-a="del" data-id="${x.id}">Cancelar</button></div></div>`).join("");
}
$("list").onclick=async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const id=b.dataset.id,x=AG.find(i=>i.id==id);
 if(b.dataset.a=="wa"){let t=x.telefone.replace(/\D/g,"");if(t.length<=11)t="55"+t;
  const m=`Olá, ${x.cliente.split(" ")[0]}! Aqui é do Studio 01 Barbearia. Confirmando seu horário dia ${fdata(x.data)} às ${hhmm(x.inicio)} com ${x.barbeiro}. 💈`;
  window.open(`https://wa.me/${t}?text=${encodeURIComponent(m)}`,"_blank")}
 if(b.dataset.a=="del"&&confirm(`Cancelar o horário de ${x.cliente} às ${hhmm(x.inicio)}?\nO horário volta a ficar livre no site.`)){
  const bt=db.batch();bt.delete(db.collection("agendamentos").doc(id));bt.delete(db.collection("ocupados").doc(id));await bt.commit()}
 if(b.dataset.a=="mv")return mover(x);
 if(b.dataset.a=="free"&&confirm("Liberar este horário para os clientes?"))await db.collection("ocupados").doc(id).delete();
};

/* ---------- modal ---------- */
const abre=h=>{$("mdc").innerHTML=h;$("md").classList.remove("hide")};
const fecha=()=>$("md").classList.add("hide");
$("md").onclick=e=>{if(e.target.id=="md"||e.target.dataset.x)fecha()};
const conflito=(barb,ini,fim,lista)=>lista.filter(b=>(b.barbeiro==barb||b.barbeiro=="*"||barb=="*")&&ini<b.fim&&fim>b.inicio);

/* novo agendamento manual */
$("bNew").onclick=()=>{
 abre(`<h3>Novo agendamento</h3><p style="color:var(--mut);font-size:.82rem">Para clientes que ligam ou chegam na loja • ${fdata(date)}</p>
 <label>Cliente (buscar ou cadastrar)</label><input id="mC" list="dlC" placeholder="🔎 Digite nome ou telefone" autocomplete="off"><datalist id="dlC">${CLI.map(c=>`<option value="${esc(c.nome)} • ${esc(c.telefone||"sem telefone")}">`).join("")}</datalist>
 <div class="row2"><div><label>Nome</label><input id="mN" placeholder="Nome"></div><div><label>WhatsApp</label><input id="mT" inputmode="tel" placeholder="(21) 99999-9999" maxlength="15"></div></div>
 <div id="mI" style="font-size:.78rem;color:var(--mut);margin-top:6px">Se o cliente já existir, escolha na busca. Se for novo, preencha nome e WhatsApp: ele é cadastrado automaticamente.</div>
 <div class="row2"><div><label>Barbeiro</label><select id="mB">${AGENDA_B.map(b=>`<option${b.n==fb?" selected":""}>${esc(b.n)}</option>`).join("")}</select></div>
 <div><label>Início</label><select id="mH">${timeOpts(OPEN,CLOSE-STEP)}</select></div></div>
 <label>Serviços</label><div class="sv">${SERVICOS.map(s=>`<label class="ck"><input type="checkbox" value="${s.id}">${s.n}<span>${precoServ(s)} • ${s.min}min</span></label>`).join("")}</div>
 <label class="ck" style="margin-top:10px"><input type="checkbox" id="mSil">🤫 Cliente prefere silêncio (sem conversa)</label>
 <label>Observação (opcional)</label><input id="mObs" maxlength="200" placeholder="Ex: referência de corte, alergia...">
 <div id="mW"></div>
 <button class="btn g full" id="mS">Salvar agendamento</button><button class="btn full" style="margin-top:8px" data-x="1">Cancelar</button>`);
 let sel=null;
 $("mC").oninput=()=>{const v=$("mC").value,c=CLI.find(x=>x.nome+" • "+(x.telefone||"sem telefone")==v);
  if(c){sel=c;$("mN").value=c.nome;$("mT").value=c.telefone;$("mI").textContent=c.conta?"✅ Cliente com conta no site: o horário aparece para ele em Meus agendamentos.":"📇 Cadastro seu: o horário aparece para ele quando criar conta no site e informar este WhatsApp."}else sel=null};
 $("mT").oninput=e=>{e.target.value=mask(e.target.value)};
 $("mS").onclick=async()=>{
  const nome=$("mN").value.trim(),tel=telNorm($("mT").value),ids=[...document.querySelectorAll("#mdc .sv input:checked")].map(i=>i.value);
  if(!nome||!ids.length){$("mW").innerHTML='<div class="warn">Informe o nome e escolha ao menos um serviço.</div>';return}
  const sv=ids.map(id=>SERVICOS.find(s=>s.id==id)),D=sv.reduce((a,s)=>a+s.min,0),ini=+$("mH").value,fim=ini+D,barb=$("mB").value;
  const cf=conflito(barb,ini,fim,OC);
  if(!tel&&!confirm("Sem WhatsApp o cliente não vê esse horário no site e você não consegue chamá-lo por aqui. Salvar assim mesmo?"))return;
  if(cf.length&&!confirm(`Esse horário conflita com outro agendamento ou bloqueio (${cf.map(c=>hhmm(c.inicio)+"–"+hhmm(c.fim)).join(", ")}). Salvar mesmo assim?`))return;
  if(fim>CLOSE&&!confirm(`O atendimento termina às ${hhmm(fim)}, depois do fechamento. Salvar mesmo assim?`))return;

/* ---------- calendário do mês ---------- */
let calM=new Date();calM.setDate(1);
async function calRender(){
 const y=calM.getFullYear(),m=calM.getMonth(),a1=iso(new Date(y,m,1)),b1=iso(new Date(y,m+1,0)),box=$("vCal");
 box.innerHTML='<p class="empty">Carregando…</p>';
 try{
  const [q1,q2]=await Promise.all([db.collection("agendamentos").where("data",">=",a1).where("data","<=",b1).get(),db.collection("ocupados").where("data",">=",a1).where("data","<=",b1).get()]);
  const cnt={},blk={};let tot=0,n=0;
  q1.docs.forEach(d=>{const x=d.data();cnt[x.data]=(cnt[x.data]||0)+1;tot+=+x.total||0;n++});
  q2.docs.forEach(d=>{const x=d.data();if(x.bloqueio)blk[x.data]=1});
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),hj=iso(new Date());
  let cells="";for(let i=0;i<first;i++)cells+='<div class="cd emp"></div>';
  for(let d=1;d<=days;d++){const dt=new Date(y,m,d),k=iso(dt);
   cells+=`<button class="cd${DIAS_ABERTOS.includes(dt.getDay())?"":" off"}${k==hj?" today":""}${blk[k]?" blk":""}" data-d="${k}"><b>${d}</b>${cnt[k]?`<i>${cnt[k]}</i>`:""}${blk[k]?"🔒":""}</button>`}
  box.innerHTML=`<div class="cm"><button class="btn" id="cP">‹</button><b>${calM.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</b><button class="btn" id="cN">›</button></div>
   <div class="stats"><div><b>${n}</b><span>Agendamentos no mês</span></div><div><b>${brl(tot)}</b><span>Previsto no mês</span></div></div>
   <div class="cg">${["D","S","T","Q","Q","S","S"].map(x=>`<small>${x}</small>`).join("")}${cells}</div>
   <p style="color:var(--mut);font-size:.78rem;margin-top:10px">Toque em um dia para abrir a agenda dele. 🔒 = tem bloqueio.</p>`;
  $("cP").onclick=()=>{calM.setMonth(calM.getMonth()-1);calRender()};$("cN").onclick=()=>{calM.setMonth(calM.getMonth()+1);calRender()};
  box.querySelectorAll(".cd[data-d]").forEach(c=>c.onclick=()=>{setDate(c.dataset.d);tab("ag")});
 }catch(e){console.error(e);box.innerHTML='<p class="empty">Erro ao carregar o calendário.</p>'}
}

const PAL=["#1f4e79","#5b2c83","#1b6b4a","#8a4b12","#7a1f3d"];
function gridRender(){
 const box=$("vGr");if(box.classList.contains("hide"))return;
 const bs=AGENDA_B.map(b=>b.n),n=Math.ceil((CLOSE-OPEN)/STEP),H=44,dtD=new Date(date+"T12:00:00");
 const dtt=dtD.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"}),lim=v=>Math.min(n,Math.max(0,v));
 let g='<div class="gh" style="grid-column:1;grid-row:1;z-index:4;left:0"></div>'+bs.map((b,i)=>`<div class="gh" style="grid-column:${i+2};grid-row:1;border-top:3px solid ${PAL[i%PAL.length]}">${esc(b)}</div>`).join("");
 for(let r=0;r<n;r++){const t=OPEN+r*STEP,hr=t%60==0?" hr":"";
  g+=`<div class="gt${hr}" style="grid-column:1;grid-row:${r+2}">${hhmm(t)}</div>`;
  bs.forEach((b,i)=>{g+=`<button class="gc${hr}" data-b="${esc(b)}" data-t="${t}" style="grid-column:${i+2};grid-row:${r+2}"></button>`})}
 const pos=x=>{const s=lim(Math.floor((x.inicio-OPEN)/STEP)),e=Math.max(s+1,lim(Math.ceil((x.fim-OPEN)/STEP)));return (s+2)+"/"+(e+2)};
 let fora=0;
 AG.forEach(x=>{const i=bs.indexOf(x.barbeiro);if(i<0){fora++;return}
  g+=`<div class="gb" data-id="${x.id}" data-k="ag" style="grid-column:${i+2};grid-row:${pos(x)};background:${PAL[i%PAL.length]}"><b>${hhmm(x.inicio)} ${esc(x.cliente)}</b><small>${esc((x.servicos||[]).join(" + "))}${x.silencio?" 🤫":""}${x.obs?" 📝":""}</small></div>`});
 OC.filter(x=>x.bloqueio).forEach(x=>{const i=bs.indexOf(x.barbeiro),c=x.barbeiro=="*"?"2/"+(bs.length+2):(i<0?null:String(i+2));if(!c)return;

 abre(`<h3>${esc(b)} • ${hhmm(t)}</h3><p style="color:var(--mut);font-size:.82rem;margin-bottom:6px">${fdata(date)}</p>
  <button class="btn w full" id="gNv">＋ Novo agendamento</button><button class="btn r full" id="gBl">🔒 Bloquear a partir daqui</button><button class="btn full" data-x="1" style="margin-top:8px">Fechar</button>`);
 $("gNv").onclick=()=>{fecha();$("bNew").onclick();$("mB").value=b;$("mH").value=t};
 $("gBl").onclick=()=>{fecha();$("bBlock").onclick();$("bB").value=b;$("bI").value=t;$("bF").value=Math.min(t+60,CLOSE)};
}

/* ---------- clientes ---------- */
let CL=[],CLI=[],cOff=null;
const mask=v=>{v=v.replace(/\D/g,"").slice(0,11);return v.length>10?v.replace(/(\d{2})(\d{5})(\d{4})/,"($1) $2-$3"):v.length>6?v.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3"):v.length>2?v.replace(/(\d{2})(\d*)/,"($1) $2"):v};
function clientesLive(){
 cOff&&cOff();
 cOff=db.collection("clientes").onSnapshot(s=>{CL=s.docs.map(d=>({id:d.id,...d.data()}));montaCLI();if(!$("vCli").classList.contains("hide"))cliRender(document.activeElement&&document.activeElement.id=="cqs"?document.activeElement.value:undefined)},e=>console.warn("clientes",e));
}
function montaCLI(){
 const porTel={},out=[];
 CL.filter(c=>!c.manual).forEach(c=>{const o={id:c.id,nome:c.nome||c.email||"(sem nome)",telefone:c.telefone||"",tel:c.tel||"",email:c.email||"",uid:c.uid||c.id,conta:true};out.push(o);if(o.tel)porTel[o.tel]=o});
 CL.filter(c=>c.manual).forEach(c=>{if(c.tel&&porTel[c.tel])return;out.push({id:c.id,nome:c.nome||"(sem nome)",telefone:c.telefone||"",tel:c.tel||"",email:"",uid:"",conta:false,manual:true})});
 CLI=out.sort((x,y)=>x.nome.localeCompare(y.nome,"pt-BR"));
}
function cliRender(q){
 const box=$("vCli"),f=(q||"").toLowerCase(),dq=telNorm(q);
 const L=CLI.filter(c=>!f||c.nome.toLowerCase().includes(f)||(dq&&c.tel.includes(dq))||c.email.toLowerCase().includes(f));
 box.innerHTML=`<div class="card cf"><input id="cqs" placeholder="🔎 Buscar por nome, telefone ou e-mail" value="${esc(q||"")}"><button class="btn w full" data-a="newC">＋ Novo cliente</button></div>
 <p class="gi">${L.length} cliente(s) • ${CLI.filter(c=>c.conta).length} com conta no site</p>`+
 (L.length?L.map(c=>`<div class="card it" style="border-left-color:${c.conta?"#25d366":"#888"}"><div class="h"><b>${esc(c.nome)}</b><span>${c.conta?"✅ Com conta":"📇 Cadastro seu"}</span></div><p>📞 ${esc(c.telefone||"sem telefone")}${c.email?" • ✉️ "+esc(c.email):""}</p>
  <div class="bt"><button class="btn w" data-a="ag" data-id="${c.id}">＋ Agendar</button>${c.tel?`<button class="btn g" data-a="wa" data-id="${c.id}">WhatsApp</button>`:""}${c.manual?`<button class="btn r" data-a="del" data-id="${c.id}">Excluir</button>`:""}</div></div>`).join(""):'<div class="empty">Nenhum cliente encontrado.</div>');
 if(q!=null){const i=$("cqs");i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}
$("vCli").oninput=e=>{if(e.target.id=="cqs")cliRender(e.target.value)};
$("vCli").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const c=CLI.find(x=>x.id==b.dataset.id),A=b.dataset.a;
 if(A=="newC")return novoCli();
 if(A=="ag"&&c)return novoAg(c);
 if(A=="wa"&&c)window.open("https://wa.me/55"+c.tel+"?text="+encodeURIComponent("Olá, "+c.nome.split(" ")[0]+"! Aqui é do Studio 01 Barbearia. 💈"),"_blank");
 if(A=="del"&&c&&confirm(`Excluir o cadastro de ${c.nome}? Os agendamentos dele continuam na agenda.`))db.collection("clientes").doc(c.id).delete();
};
function novoAg(c){$("bNew").onclick();if(c){$("mC").value=c.nome+" • "+(c.telefone||"sem telefone");$("mC").oninput()}}
function novoCli(){
 abre(`<h3>＋ Novo cliente</h3><p style="color:var(--mut);font-size:.82rem">Quando ele criar conta no site com este WhatsApp, vai ver os horários que você marcar.</p>
 <label>Nome</label><input id="cN" placeholder="Nome completo"><label>WhatsApp</label><input id="cT" inputmode="tel" placeholder="(21) 99999-9999" maxlength="15">
 <div id="mW"></div><button class="btn g full" id="cS">Cadastrar</button><button class="btn full" style="margin-top:8px" data-x="1">Cancelar</button>`);
 $("cT").oninput=e=>{e.target.value=mask(e.target.value)};
 $("cS").onclick=async()=>{const nome=$("cN").value.trim(),tel=telNorm($("cT").value);
  if(!nome||tel.length<10){$("mW").innerHTML='<div class="warn">Informe o nome e o WhatsApp com DDD.</div>';return}
  const ex=CLI.find(x=>x.tel==tel);if(ex){$("mW").innerHTML='<div class="warn">Esse WhatsApp já está cadastrado em nome de <b>'+esc(ex.nome)+'</b>.</div>';return}
  $("cS").disabled=true;
  try{await db.collection("clientes").doc("t"+tel).set({nome,telefone:telFmt(tel),tel,uid:"",manual:true,criadoEm:new Date().toISOString()});fecha()}
  catch(x){$("mW").innerHTML='<div class="warn">Erro: '+esc(x.code||x.message)+'</div>';$("cS").disabled=false}
 };
}

/* ---------- galeria de fotos (cortes e espaço) ---------- */
let GA=[];
function lerImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>rej(new Error("não consegui ler "+f.name));im.src=u})}
function jpg(im,max,qs,lim){let url="";for(const q of qs){const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);url=c.toDataURL("image/jpeg",q);if(url.length<=lim)break}return url}
function galOpen(){
 $("vGal").innerHTML=`<div class="card cf"><h3>🖼️ Adicionar fotos ao site</h3>
  <p style="color:var(--mut);font-size:.8rem">As fotos aparecem na seção <b>Galeria</b> do site assim que forem enviadas. Pode escolher várias de uma vez.</p>
  <label>Onde mostrar</label><select id="gCat"><option value="cortes">Cortes</option><option value="local">Nosso espaço</option></select>
  <label>Legenda (opcional, vale para todas desta vez)</label><input id="gLeg" placeholder="Ex: Degradê navalhado">
  <input type="file" id="gFile" accept="image/*" multiple style="display:none">
  <button class="btn w full" id="gBtn">📷 Escolher fotos</button><div id="gMsg" style="margin-top:10px"></div></div>
  <div id="gList"><p class="empty">Carregando…</p></div>`;
 galLoad();
}
async function galLoad(){
 try{
  const q=await db.collection("galeria").orderBy("ordem","desc").get();GA=q.docs.map(d=>({id:d.id,...d.data()}));
  $("gList").innerHTML=GA.length?`<p class="gi">${GA.length} foto(s) no site • toque em <b>Cortes/Espaço</b> para trocar a categoria</p><div class="gad">`+GA.map(g=>`<div><img src="${g.thumb}" alt=""><button class="x" data-del="${g.id}">✕</button><button class="ed" data-leg="${g.id}">✏️</button><button class="tg" data-cat="${g.id}">${g.cat=="cortes"?"Cortes":"Espaço"}</button><small>${esc(g.legenda||"sem legenda")}</small></div>`).join("")+"</div>":'<p class="empty">Nenhuma foto ainda. Adicione a primeira acima.</p>';
 }catch(e){console.error(e);$("gList").innerHTML='<p class="empty">Erro ao carregar. Confira se as regras novas do Firestore foram publicadas.</p>'}
}
async function galUp(files){
 const cat=$("gCat").value,leg=$("gLeg").value.trim(),m=$("gMsg");let ok=0;
 for(let i=0;i<files.length;i++){
  m.className="ok";m.textContent="Enviando "+(i+1)+" de "+files.length+"…";
  try{
   const im=await lerImg(files[i]),thumb=jpg(im,520,[.72,.6,.5],90000),full=jpg(im,1400,[.8,.7,.6,.5],850000);
   const id=db.collection("galeria").doc().id,bt=db.batch();
   bt.set(db.collection("galeria").doc(id),{thumb,legenda:leg,cat,ordem:Date.now()+i,criadoEm:new Date().toISOString()});
   bt.set(db.collection("galeria_img").doc(id),{full});
   await bt.commit();ok++;
  }catch(e){m.className="warn";m.textContent="Erro em "+files[i].name+": "+(e.code||e.message);galLoad();return}
 }
 m.className="ok";m.textContent="✅ "+ok+" foto(s) adicionada(s). Já aparecem no site.";$("gFile").value="";galLoad();
}
$("vGal").onclick=async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id=="gBtn")return $("gFile").click();
 const id=b.dataset.del||b.dataset.cat||b.dataset.leg;if(!id)return;const g=GA.find(x=>x.id==id);if(!g)return;
 try{
  if(b.dataset.del&&confirm("Excluir esta foto do site?")){const bt=db.batch();bt.delete(db.collection("galeria").doc(id));bt.delete(db.collection("galeria_img").doc(id));await bt.commit();galLoad()}
  if(b.dataset.cat){await db.collection("galeria").doc(id).update({cat:g.cat=="cortes"?"local":"cortes"});galLoad()}
  if(b.dataset.leg){const t=prompt("Legenda da foto:",g.legenda||"");if(t!==null){await db.collection("galeria").doc(id).update({legenda:t.trim()});galLoad()}}
 }catch(x){alert("Erro: "+(x.code||x.message))}
};
$("vGal").onchange=e=>{if(e.target.id=="gFile"&&e.target.files.length)galUp([...e.target.files])};
</script>
